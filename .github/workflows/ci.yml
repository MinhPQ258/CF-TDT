name: CI / Deploy

# PR: kiểm tra. Push lên main (hoặc chạy tay): kiểm tra → migration Supabase → deploy Vercel.
# Migration chạy TRƯỚC deploy để code mới không chạy trên DB cũ. Vercel không tự deploy main (vercel.json).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # DB thật (Postgres qua PGlite) chạy toàn bộ migration + test posting, bất biến, quyền, property test
      - run: npm test
      - name: Bundle SQL khớp migrations
        run: |
          npm run db:bundle
          git diff --exit-code supabase/deploy/coffee_tdt_full.sql
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  migrate:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra secrets
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Thiếu GitHub secret:$missing — xem README mục Auto migration. Không migrate, không deploy."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project production
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Baseline — đánh dấu migration đã dựng tay trước đây (idempotent)
        run: |
          versions=$(grep -E '^[0-9]{14}$' supabase/baseline-production.txt | tr '\n' ' ')
          supabase migration repair --status applied $versions --yes
      - name: Migration sẽ chạy
        run: supabase migration list
      - name: Chạy migration mới
        run: supabase db push --yes

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Gọi Vercel Deploy Hook (production)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Thiếu secret VERCEL_DEPLOY_HOOK_URL — migration đã chạy, nhưng chưa deploy app."
            exit 1
          fi
          curl -fsS -X POST "$HOOK"
          echo "Đã yêu cầu Vercel deploy commit ${GITHUB_SHA::7}"
