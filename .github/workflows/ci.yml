name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # DB thật (Postgres qua PGlite) chạy toàn bộ migration + test posting, bất biến, quyền, property test
      - run: npm test
      - name: Bundle SQL khớp migrations
        run: |
          npm run db:bundle
          git diff --exit-code supabase/deploy/coffee_tdt_full.sql
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
